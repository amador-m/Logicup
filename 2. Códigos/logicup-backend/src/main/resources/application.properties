spring.application.name=logicup-backend

# Credenciais lidas de variáveis de ambiente (não ficam mais no código/GitHub).
# DB_USERNAME tem valor padrão "root"; DB_PASSWORD é obrigatória.
spring.datasource.url=jdbc:mysql://localhost:3306/Logicup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# C2: o acesso ao banco fica restrito à camada de Service (dentro de @Transactional)
spring.jpa.open-in-view=false

# ---- Autenticação (Sprint 6) ----
# JWT_SECRET é obrigatória: texto aleatório com pelo menos 32 caracteres. Nunca commitar.
logicup.auth.jwt-secret=${JWT_SECRET}
# AU2: validade do token (e do cookie)
logicup.auth.validade-token=8h
# cookie só trafega em HTTPS; navegadores tratam localhost como seguro. Use COOKIE_SEGURO=false só se o cookie não for salvo em dev.
logicup.auth.cookie-seguro=${COOKIE_SEGURO:true}

# ---- ADMIN de desenvolvimento (só usado no perfil dev, pelo DatabaseTestRunner) ----
logicup.dev.admin-email=${ADMIN_EMAIL:}
logicup.dev.admin-senha=${ADMIN_SENHA:}
