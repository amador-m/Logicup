# =====================================================================
# LogiCup — perfil de PRODUÇÃO (deploy, 03/11/2026)
#
# Ativado com SPRING_PROFILES_ACTIVE=prod (o docker-compose.yml faz isso).
# Este arquivo só SOBRESCREVE o que muda em relação ao application.properties; o resto vale igual.
# NENHUM segredo aqui: senhas e chaves vêm de variáveis de ambiente (arquivo .env só na VM).
# =====================================================================

# --- Banco: o MySQL é outro contêiner, chamado "mysql" na rede interna do Docker ---
# Usuário próprio da aplicação (logicup_app), só com SELECT/INSERT/UPDATE/DELETE: mesmo que alguém
# explore uma falha no backend, ele não consegue apagar tabelas nem criar usuários no banco.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/Logicup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:logicup_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# Em produção, o SQL não vai para o log (polui o log e pode expor dados dos alunos)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Atrás do proxy (Caddy) ---
# Sem isto, request.getRemoteAddr() devolveria o IP do CADDY para todo mundo, e o limite de logins
# por IP (150 erros a cada 15 min) seria dividido por TODOS os alunos ao mesmo tempo.
# "native" liga o RemoteIpValve do Tomcat: ele troca o IP da conexão pelo IP do X-Forwarded-For,
# MAS SÓ quando a conexão vem de um proxy confiável (internal-proxies). Assim, um aluno que mande um
# X-Forwarded-For falso direto para o backend não consegue fingir outro IP.
# O Caddy, por sua vez, DESCARTA o X-Forwarded-For que vem do navegador e escreve o IP real.
server.forward-headers-strategy=native
# só o Caddy, que tem IP fixo na rede "web" do docker-compose.yml. É uma expressão regular.
server.tomcat.remoteip.internal-proxies=${PROXIES_CONFIAVEIS:172\\.28\\.0\\.10}

# Desligamento gracioso: ao atualizar, termina as requisições em andamento antes de parar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Erros nunca mostram detalhes internos para o navegador
server.error.include-stacktrace=never
server.error.include-message=never

# --- Executor de código (Piston, em outra VM, só na rede interna do Google Cloud) ---
logicup.executor.habilitado=${EXECUTOR_HABILITADO:true}
logicup.executor.url=${EXECUTOR_URL}

# --- Segurança ---
logicup.seguranca.origens-confiaveis=${ORIGENS_CONFIAVEIS}
logging.level.root=INFO

# --- Sprint 10: e-mails pela Brevo (SMTP) ---
# O login e a chave SMTP ficam SÓ no .env da VM (SMTP_USUARIO e SMTP_CHAVE). A chave nunca vai para o GitHub.
logicup.email.modo=smtp
logicup.email.url-publica=${URL_PUBLICA:https://logicup.dev.br}
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORTA:587}
spring.mail.username=${SMTP_USUARIO}
spring.mail.password=${SMTP_CHAVE}
# 587 + STARTTLS obrigatório: se o servidor não oferecer TLS, o envio FALHA em vez de mandar a chave aberta
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# tempos máximos (ms): um servidor de e-mail travado não segura as threads de envio para sempre
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
