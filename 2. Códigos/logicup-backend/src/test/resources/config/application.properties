# =====================================================================
# Configuração SÓ DOS TESTES (Sprint 9). Este arquivo NÃO vai para a produção.
#
# O Spring Boot carrega o application.properties principal E este aqui (classpath:/config/ tem
# prioridade sobre classpath:/). Aqui só sobrescrevemos o que os testes precisam diferente.
#
# Por quê: os limites de tentativas ficam em MEMÓRIA e os testes de integração compartilham o mesmo
# processo. Vários testes cadastram contas e erram senhas de propósito a partir de 127.0.0.1; com os
# limites reais (ex.: 10 cadastros por hora por IP), testes que não têm nada a ver com o limite
# falhariam por causa dos outros. O comportamento do limite é testado à parte, com limites baixos,
# no LimiteTentativasIntegrationTest.
# =====================================================================
logicup.limites.login-conta.maximo=1000
logicup.limites.login-ip.maximo=1000
logicup.limites.codigo-turma.maximo=1000
logicup.limites.cadastro.maximo=1000
# Sprint 9 (ADR-001): os testes NUNCA dependem do Piston. O executor fica desligado e os testes que
# precisam de execução usam um executor falso (ExecutorFalso). Limite de execuções alto, pelo mesmo
# motivo dos limites acima.
logicup.executor.habilitado=false
logicup.limites.execucao.maximo=1000
# Sprint 10: nos testes o e-mail NUNCA sai (modo log) e o "envio" roda na mesma thread, para o teste
# saber que, quando a requisição terminou, o pedido de e-mail já foi processado.
logicup.email.modo=log
logicup.email.envio-assincrono=false
logicup.limites.email-endereco.maximo=1000
logicup.limites.email-ip.maximo=1000
# Sprint 10: tarefas agendadas desligadas nos testes (o teste chama a limpeza diretamente)
logicup.agendamentos.habilitado=false
