# =====================================================================
# LogiCup — perfil "criar-admin" (deploy, 03/11/2026). Usado junto com "prod":
#   SPRING_PROFILES_ACTIVE=prod,criar-admin   (quem faz isso é o deploy/app/criar_admin.sh)
