spring.application.name=logicup-backend

# Credenciais lidas de variáveis de ambiente (não ficam mais no código/GitHub).
# DB_USERNAME tem valor padrão "root"; DB_PASSWORD é obrigatória.
spring.datasource.url=jdbc:mysql://localhost:3306/Logicup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# C2: o acesso ao banco fica restrito à camada de Service (dentro de @Transactional)
spring.jpa.open-in-view=false

# ---- Autenticação (Sprint 6) ----
# JWT_SECRET é obrigatória: texto aleatório com pelo menos 32 caracteres. Nunca commitar.
logicup.auth.jwt-secret=${JWT_SECRET}
# AU2: validade do token (e do cookie)
logicup.auth.validade-token=8h
# Tarefa 6: os cookies são SEMPRE Secure (exigido pelo prefixo __Host-); não existe mais a opção COOKIE_SEGURO.

# ---- Tarefa 6: origens confiáveis para requisições que alteram dados (esquema://host[:porta], separadas por vírgula) ----
# Desenvolvimento: o React roda no Vite (localhost:5173). Produção: defina ORIGENS_CONFIAVEIS com a URL https pública.
# Sem curingas: a aplicação não sobe se a lista tiver "*", "null", caminho ou ficar vazia.
logicup.seguranca.origens-confiaveis=${ORIGENS_CONFIAVEIS:http://localhost:5173}

# ---- ADMIN de desenvolvimento (só usado no perfil dev, pelo DatabaseTestRunner) ----
logicup.dev.admin-email=${ADMIN_EMAIL:}
logicup.dev.admin-senha=${ADMIN_SENHA:}

# ---- Sprint 9: limite de tentativas (ProtecaoForcaBruta). Janela: 15m = 15 minutos, 1h = 1 hora ----
# Login, regra "conta + IP": 5 erros em 15 min bloqueiam aquela conta naquele IP (D1-A)
logicup.limites.login-conta.maximo=5
logicup.limites.login-conta.janela=15m
# Login, regra "só IP": 150 erros em 15 min bloqueiam o IP (quem testa muitas contas).
# Sprint 10: era 30. Uma turma inteira num laboratório sai pelo MESMO IP público da escola; 40 alunos
# errando a senha 3 ou 4 vezes já chegavam a 30. A proteção de cada conta continua nos 5 erros acima.
logicup.limites.login-ip.maximo=150
logicup.limites.login-ip.janela=15m
# Código de turma: 10 códigos inexistentes em 15 min, por aluno (D2)
logicup.limites.codigo-turma.maximo=10
logicup.limites.codigo-turma.janela=15m
# Cadastro: 60 tentativas por hora, por IP (D4). Sprint 10: era 10, o que travava uma turma de 30 se cadastrando
# junta no laboratório. Robôs criando contas em massa continuam limitados (e cada conta precisa confirmar o e-mail).
logicup.limites.cadastro.maximo=60
logicup.limites.cadastro.janela=1h
# ---- Sprint 9 (ADR-001): executor de código (Piston self-hosted) ----
# Desligado por padrão: sem o Piston rodando, o site funciona e o botão "Executar" avisa que está indisponível.
# Para ligar: EXECUTOR_HABILITADO=true (e o Piston rodando no endereço EXECUTOR_URL).
logicup.executor.habilitado=${EXECUTOR_HABILITADO:false}
# Só na rede interna. A porta do Piston NUNCA pode ficar aberta na internet (a API dele instala pacotes).
logicup.executor.url=${EXECUTOR_URL:http://localhost:2000}
logicup.executor.versao-java=15.0.2
# Limites de CADA execução (o Piston também precisa estar configurado com limites iguais ou maiores)
logicup.executor.tempo-execucao=6s
logicup.executor.tempo-cpu=5s
logicup.executor.memoria-mb=256
# Fila: quantas execuções ao mesmo tempo, e quanto tempo um pedido espera a vez antes de desistir
logicup.executor.simultaneas=3
# Sprint 10: 30 s (era 10 s). No teste de capacidade em produção, 30 programas simultâneos levaram de 3,6 s a
# 30 s (3 por vez, ~3 s cada). Com 10 s, cerca de metade de uma turma clicando junto recebia "indisponível".
# O frontend avisa "na fila" depois de 4 s, para ninguém achar que travou.
logicup.executor.espera-na-fila=30s
# Botão "Executar": 20 execuções por minuto por usuário
logicup.limites.execucao.maximo=20
logicup.limites.execucao.janela=1m
# ---- Sprint 10: e-mails de conta (confirmação, nova senha, boas-vindas) ----
# "log" (padrão no seu PC): NADA é enviado; o e-mail, com o link, aparece no console do IntelliJ.
# "smtp" (produção): envia de verdade pela Brevo (ver application-prod.properties).
logicup.email.modo=${EMAIL_MODO:log}
logicup.email.remetente=${EMAIL_REMETENTE:LogiCup <nao-responda@logicup.dev.br>}
# endereço do SITE (frontend), usado para montar os links dos e-mails
logicup.email.url-publica=${URL_PUBLICA:http://localhost:5173}
# reenviar confirmação / esqueci a senha: 3 pedidos por hora por e-mail e 60 por hora por IP
# (60 e não 10: uma turma inteira pode pedir no mesmo laboratório; a cota da Brevo é 300 e-mails por DIA)
logicup.limites.email-endereco.maximo=3
logicup.limites.email-endereco.janela=1h
logicup.limites.email-ip.maximo=60
logicup.limites.email-ip.janela=1h
# Sprint 10: cota diária de e-mails (plano grátis da Brevo = 300 por dia). Ver CotaDiariaDeEmails.
#  alerta: avisa a equipe (uma vez por dia); reserva: só e-mails essenciais; limite: nenhum e-mail sai
logicup.email.cota.limite=300
logicup.email.cota.reserva=270
logicup.email.cota.alerta=240
logicup.email.cota.alerta-para=${EMAIL_ALERTAS:contato@logicup.dev.br}
